<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#635bff"><title>Live Quiz</title><link rel="stylesheet" href="./styles.css"></head><body>
<main class="shell"><header class="top"><div class="brand"><span class="logo">Q</span> Live Quiz</div><a id="roleLink" class="teacher-link" href="?role=teacher">선생님 화면</a></header>
<section id="studentJoin" class="card narrow"><div class="eyebrow">STUDENT</div><h1>퀴즈에 참여해요!</h1><p class="sub">선생님이 알려 준 5자리 코드를 입력하세요.</p><form id="joinForm" class="stack"><input id="roomCode" class="code" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="00000" aria-label="5자리 참여 코드" required><input id="nickname" maxlength="12" placeholder="내 이름" aria-label="이름" required><button>입장하기</button><div id="joinMessage" class="error"></div></form></section>
<section id="teacherSetup" class="card hidden"><div class="eyebrow">TEACHER</div><h1>실시간 퀴즈 만들기</h1><p class="sub">JSON 퀴즈를 불러온 뒤 방을 만드세요. 문제를 하나씩 진행하며 학생의 답과 점수를 실시간으로 볼 수 있습니다.</p><div class="tabs"><button id="uploadTab" class="active">JSON 파일</button><button id="pasteTab">직접 붙여넣기</button></div><div id="uploadPanel" class="stack"><input id="quizFile" type="file" accept=".json,application/json"><a class="button secondary" href="./sample-quiz.json" download>예시 JSON 받기</a></div><div id="pastePanel" class="stack hidden"><textarea id="quizText" rows="12" placeholder='{"title":"퀴즈 제목","questions":[...]}'></textarea><button id="loadText" class="secondary">JSON 확인</button></div><div id="quizPreview" class="status">아직 불러온 퀴즈가 없습니다.</div><button id="createRoom" disabled>5자리 방 만들기</button><div id="teacherMessage" class="error"></div></section>
<section id="lobby" class="card hidden"><div class="eyebrow">ROOM CODE</div><div class="toolbar"><span id="lobbyCode" class="code-badge"></span><span id="connectionText">연결 중…</span></div><h2 id="lobbyTitle">퀴즈 대기실</h2><p id="lobbyHint" class="sub"></p><div id="playerList" class="players"></div><button id="startQuiz" class="hidden">퀴즈 시작하기</button></section>
<section id="game" class="card hidden"><div class="toolbar"><b id="gameCode"></b><span id="timer" class="timer"></span></div><div class="progress"><i id="progressBar"></i></div><h2 id="questionText" class="question"></h2><div id="choices" class="grid"></div><div id="answerStatus" class="status hidden"></div><div id="hostControls" class="row hidden"><button id="revealAnswer" class="secondary">정답 공개</button><button id="nextQuestion">다음 문제</button></div></section>
<section id="results" class="card hidden"><div class="eyebrow">RESULT</div><h1>퀴즈 결과</h1><div id="myResult"></div><div id="ranking" class="rank"></div><div id="resultControls" class="row hidden"><button id="restartQuiz" class="secondary">다시 시작</button><button id="closeRoom" class="danger">방 종료</button></div></section>
</main><script type="module" src="./app.js"></script></body></html>
